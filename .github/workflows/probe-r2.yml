name: probe-r2
on:
  pull_request_target:
    types: [opened, synchronize, labeled]
permissions: {}
jobs:
  plan:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - run: echo plan
  cell:
    if: github.event.action != 'labeled'
    name: plan (${{ matrix.env }})
    strategy:
      matrix:
        env: [sbx, prod]
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ matrix.env }}
