name: shipmate · deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  deploy:
    # Display only: the run's job path reads
    # `shipmate · deploy / post-merge / L<n> / apply / <stack> / <env>`.
    name: post-merge
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@1efbee8fae48417bee1f634bcd6721289c060027 # v0.3.1
    permissions: { contents: read, checks: read, pull-requests: read, actions: read }
    secrets: inherit
    with:
      state_suffix: .state
