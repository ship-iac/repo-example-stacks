name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  deploy:
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@aa4d8b775a714fbabeef395255047bd9588c8848 # v0.1.0
    permissions: { contents: read, checks: read, pull-requests: read, actions: read }
    secrets: inherit
    with:
      state_suffix: .state
