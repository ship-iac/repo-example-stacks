name: shipmate · deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  deploy:
    # Display only: the run's job path reads
    # `shipmate · deploy / post-merge / L<n> / apply / <stack> / <env>`.
    name: post-merge
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@83b37bb5e0baa9256b1ea49f4725cf7f55157c8a
    permissions: { contents: read, checks: read, pull-requests: read, actions: read }
    secrets: inherit
    with:
      state_suffix: .state
