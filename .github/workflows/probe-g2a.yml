name: probe-g2a
# Temporary: captures the run titles of the fence's run-name for each event and dispatch body,
# and whether the job token can react to a comment. Removed after.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('shipmate · {0} pr={1} ref={2} comment={3}', inputs.verb, inputs.pr_number, inputs.ref, inputs.comment_id)
  || format('shipmate · {0}', github.event_name == 'pull_request_target'
  && github.event.action == 'closed' && 'release'
  || github.event_name == 'pull_request_target' && 'plan'
  || github.event_name == 'issue_comment' && 'comment' || 'deploy') }}
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verb:
        description: What to run (plan, apply, unlock or auto)
        type: choice
        options: [plan, apply, unlock, auto]
        required: true
      environment:
        description: "Target environment (apply and unlock; empty apply = every environment without apply_mode: targeted)"
        required: false
        default: ''
      ref:
        description: PR head SHA (apply, unlock and auto)
        required: false
        default: ''
      pr_number:
        description: Pull request number (plan, apply and auto)
        required: false
        default: ''
      comment_id:
        description: Command comment id (plan, apply and unlock)
        required: false
        default: ''
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-slim
    permissions: { issues: write }
    steps:
      - name: React as the job token (unlock only)
        if: github.event_name == 'workflow_dispatch' && inputs.verb == 'unlock' && inputs.comment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -d '{"content":"rocket"}')
          echo "reaction status: $code"
      - run: echo "event=${{ github.event_name }}"
