name: probe-callee
# TEMPORARY security probe — delete after the experiment.
# Mirrors apply-env-level.yml: declares the secret under workflow_call.secrets
# (so an inherited-but-empty value could shadow it) and names the environment
# that actually holds it.
on:
  workflow_call:
    secrets:
      PROBE_CANARY: { required: false }
jobs:
  callee:
    runs-on: ubuntu-slim
    environment: shipmate-engine
    steps:
      - name: Report canary length inside called workflow
        env:
          CANARY: ${{ secrets.PROBE_CANARY }}
        run: echo "callee job — canary length ${#CANARY} (0 = shadowed/withheld)"
