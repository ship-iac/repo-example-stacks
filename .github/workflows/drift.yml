name: shipmate · drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch: {}     # manual trigger for acceptance
permissions:
  contents: read
jobs:
  detect:
    # gh workflow run drift.yml --ref <branch> would otherwise run branch code
    # in a plan environment, which must stay policy-free (no branch
    # restriction) for planning to work at all -- so a job naming one is
    # reachable from a feature branch unless guarded here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      empty: ${{ steps.m.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ship-iac/shipmate/actions/setup@07c2de1eea9b9576239f9e5a60efb6962e491c7e # v0.2.3
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - id: m
        uses: ship-iac/shipmate/actions/build-matrix@07c2de1eea9b9576239f9e5a60efb6962e491c7e # v0.2.3
        with:
          base-sha: ""
          all-stacks: "true"
  drift:
    needs: detect
    if: ${{ needs.detect.outputs.empty == 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-slim
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    name: ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ship-iac/shipmate/actions/setup@07c2de1eea9b9576239f9e5a60efb6962e491c7e # v0.2.3
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/drift-cell@5ea8fc35053a8550a1dd4a378455761f65b88107 # provisional pin: branch-local commit, not yet on main -- repin with dev/repin_internal.py once this merges
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          state-path: ${{ matrix.stack }}/.state

  # Completes the credentialed work drift-cell no longer does: authors/closes
  # the drift Issues, from downloaded drift-summary cell artifacts, and holds
  # the only App key on the drift path.
  issues:
    needs: [detect, drift]
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-slim
    environment: shipmate-engine
    permissions: { actions: read }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # continue-on-error: an empty drift matrix (nothing to plan this run)
        # downloads nothing to match the pattern -- drift-issues degrades to a
        # clean no-op on an empty cells directory, so a failed/empty download
        # must not fail this job.
        continue-on-error: true
        with: { pattern: drift-summary.*, path: drift }
      - uses: ship-iac/shipmate/actions/drift-issues@5ea8fc35053a8550a1dd4a378455761f65b88107 # provisional pin: branch-local commit, not yet on main -- repin with dev/repin_internal.py once this merges
        with:
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          slack-webhook: ${{ vars.SLACK_WEBHOOK }}
