name: probe-g1-label
on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr: { required: true }
permissions: { contents: read }
jobs:
  log:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - env:
          LABEL: ${{ github.event.label.name }}
          LOGIN: ${{ github.event.sender.login }}
          SID: ${{ github.event.sender.id }}
          STYPE: ${{ github.event.sender.type }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: echo "label=$LABEL sender=$LOGIN id=$SID type=$STYPE labels=$LABELS"
  app-label:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 4326562
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env: { GH_TOKEN: "${{ steps.token.outputs.token }}", PR: "${{ inputs.pr }}" }
        run: |
          r=repos/${GITHUB_REPOSITORY}/issues/$PR/labels
          echo "== add (absent) $(date -u +%T)"; gh api -X POST $r -f 'labels[]=probe-g1-app' --jq '[.[].name]'
          sleep 20
          echo "== add again (present) $(date -u +%T)"; gh api -X POST $r -f 'labels[]=probe-g1-app' --jq '[.[].name]'
          sleep 20
          echo "== remove then add $(date -u +%T)"; gh api -X DELETE $r/probe-g1-app --jq '[.[].name]'; gh api -X POST $r -f 'labels[]=probe-g1-app' --jq '[.[].name]'
          sleep 10
          echo "== add two labels in one call, one present $(date -u +%T)"; gh api -X POST $r -f 'labels[]=probe-g1-app' -f 'labels[]=probe-g1-app2' --jq '[.[].name]'
