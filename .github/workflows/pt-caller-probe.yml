name: pt caller probe
# TEMPORARY probe — delete after the experiment.
# Stands in for the consumer plan.yml's `summary` job: a pull_request_target
# workflow whose job calls a reusable workflow. Nothing here is the gate, so a
# wrong answer costs nothing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  summary:
    if: ${{ !cancelled() }}
    # A callee's permissions are capped by this job's. Without this grant the
    # callee's `contents: read` exceeds the cap and the whole run dies at
    # startup, with no job, no log and no annotation to say why.
    permissions:
      contents: read
    uses: ./.github/workflows/pt-callee-probe.yml
    with:
      caller-saw-draft: ${{ github.event.pull_request.draft }}
