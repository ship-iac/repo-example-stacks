name: probe-rr2
on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      target: { required: true }
permissions: { contents: read }
jobs:
  plan:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "plan attempt=$GITHUB_RUN_ATTEMPT"
  router:
    if: github.event_name == 'pull_request_target' && github.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
      - run: echo "fence=v1 attempt=$GITHUB_RUN_ATTEMPT"
  remote:
    needs: router
    uses: ship-iac/repo-example-stacks/.github/workflows/probe-rr2-called.yml@main
  gated:
    needs: router
    runs-on: ubuntu-latest
    environment: probe-rr-approve
    steps:
      - run: echo "gated ran attempt=$GITHUB_RUN_ATTEMPT"
  driver:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 4326562
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env: { GH_TOKEN: "${{ steps.token.outputs.token }}", T: "${{ inputs.target }}" }
        run: gh api -X POST repos/${GITHUB_REPOSITORY}/actions/jobs/$T/rerun -i | head -1
