name: probe-m26-app
on:
  workflow_dispatch:
    inputs:
      sha: { required: true }
permissions: { contents: read }
jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 4326562
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -u
          r=repos/$GITHUB_REPOSITORY
          id=$(gh api -X POST $r/check-runs -f name="probe-m26 / burst" -f head_sha="$SHA" -f status=queued --jq .id)
          mkdir -p out
          start=$(date +%s)
          seq 1 256 | xargs -P 8 -I{} sh -c "gh api -i -X PATCH $r/check-runs/$id -f status=in_progress > out/{}.txt 2>&1 || true"
          echo "elapsed $(( $(date +%s) - start )) s"
          for f in out/*.txt; do head -1 "$f"; done | sort | uniq -c
          first=$(grep -L ' 200 ' out/*.txt | head -1)
          if [ -n "$first" ]; then
            echo "== full first non-200 ($first)"; cat "$first"
            t0=$(date +%s)
            for k in $(seq 1 40); do sleep 15; o=$(gh api -i -X PATCH "$r/check-runs/$id" -f status=queued 2>&1); echo "recovery +$(( $(date +%s) - t0 )) s: $(printf '%s\n' "$o" | head -1) retry-after=$(printf '%s\n' "$o" | grep -i '^retry-after' | tr -d '\r')"; case "$(printf '%s\n' "$o" | head -1)" in *" 200 "*) break ;; esac; done
          fi
          gh api -X PATCH "$r/check-runs/$id" -f status=completed -f conclusion=neutral --jq .status || true
