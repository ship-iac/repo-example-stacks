name: probe-g6
# Temporary: calls the engine's plan workflow from a branch without the fence's per-PR plan
# group, so several plan summaries of one head contend for the gate-writer queue. Removed after.
on:
  workflow_dispatch:
    inputs:
      verb:
        type: choice
        options: [plan]
        required: true
      pr_number:
        required: true
permissions: {}
jobs:
  plan:
    name: plan
    uses: ship-iac/shipmate/.github/workflows/plan.yml@feat/gate-writer-queue
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
    with:
      runs_on: ubuntu-26.04-arm
