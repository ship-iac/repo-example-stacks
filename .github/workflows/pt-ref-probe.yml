name: pt ref probe
# TEMPORARY probe — lives only on `probe/pt-base`, never merged to main.
# Two questions in one run, against a pull request whose BASE is this
# non-default branch:
#   `ref` job    — what `github.ref` / `github.sha` are on `pull_request_target`,
#                  and whether `head.sha` is the branch tip or a merge ref.
#   `gated` job  — whether a `pull_request_target` job binding
#                  `environment: shipmate-engine` is admitted. That environment's
#                  deployment branch policy allows `main` only, so this job runs
#                  ONLY IF environment rules evaluate against the default branch
#                  rather than against this run's ref.
# Checks out nothing, runs no repository code, reads no secret.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions: {}
jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -u
          echo "ref=$REF"
          echo "ref_name=$REF_NAME"
          echo "sha=$SHA"
          echo "head_sha=$HEAD_SHA"
          echo "base_ref=$BASE_REF"
          echo "base_sha=$BASE_SHA"
          echo "draft=$DRAFT"
          echo "action=$ACTION"
          echo "head_repo=$HEAD_REPO"

  gated:
    runs-on: ubuntu-latest
    environment: shipmate-engine
    steps:
      - run: echo "shipmate-engine admitted a pull_request_target job whose ref is not main"
