name: probe-m26-t2
on:
  workflow_dispatch:
    inputs:
      arm: { required: true, type: choice, options: [flip, listing, nested] }
      sha: { required: false, default: "" }
  push:
    branches: [probe/m26-nested]
permissions: { contents: read }
jobs:
  app:
    if: github.event_name == 'workflow_dispatch' && (inputs.arm == 'flip' || inputs.arm == 'listing')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 4326562
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ inputs.sha }}
          ARM: ${{ inputs.arm }}
        run: |
          set -u
          r=repos/$GITHUB_REPOSITORY
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          q='{status,conclusion,title:.output.title,summary:.output.summary,external_id,details_url}'
          settle() { prev=""; for n in $(seq 1 15); do sleep 3; cur=$(gh api "$r/check-runs/$1" --jq "$q" 2>&1); if [ "$cur" = "$prev" ]; then echo "settled ($n reads): $cur"; return; fi; prev=$cur; done; echo "UNSETTLED: $cur"; }
          if [ "$ARM" = flip ]; then
            for i in 1 2 3; do
              id=$(gh api -X POST $r/check-runs -f name="probe-m26 / flip-$i" -f head_sha="$SHA" -f status=queued -f external_id=ext-1 -f 'output[title]=T0' -f 'output[summary]=S0' --jq .id)
              settle $id >/dev/null
              gh api -X PATCH $r/check-runs/$id -f status=in_progress -f details_url="$run_url" --jq .status >/dev/null || echo "PATCH refused"
              echo "flip-$i status plus details_url: $(settle $id)"
            done
          else
            for i in $(seq 1 10); do
              t0=$(date +%s%3N)
              rid=$(gh api -X POST $r/actions/workflows/probe-m26-noop.yml/dispatches -f ref=main -F return_run_details=true --jq .workflow_run_id)
              t1=$(date +%s%3N); seen_wf=""; seen_ev=""
              for n in $(seq 1 120); do
                [ -z "$seen_wf" ] && gh api "$r/actions/workflows/probe-m26-noop.yml/runs?per_page=20" --jq '.workflow_runs[].id' | grep -qx "$rid" && seen_wf=$(( $(date +%s%3N) - t1 ))
                [ -z "$seen_ev" ] && gh api "$r/actions/runs?event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id' | grep -qx "$rid" && seen_ev=$(( $(date +%s%3N) - t1 ))
                [ -n "$seen_wf" ] && [ -n "$seen_ev" ] && break
                sleep 0.5
              done
              echo "dispatch $i run=$rid post_ms=$(( t1 - t0 )) listed_by_workflow_ms=${seen_wf:-never} listed_by_event_ms=${seen_ev:-never}"
              sleep 3
            done
          fi
  nested:
    if: github.event_name == 'push' || inputs.arm == 'nested'
    uses: ./.github/workflows/probe-m26-t2-callee.yml
