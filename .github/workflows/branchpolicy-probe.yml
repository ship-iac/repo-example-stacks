name: branchpolicy probe
# TEMPORARY — deleted in the next commit on this branch.
# Baseline half of the pull_request_target experiment: a job binding
# `environment: shipmate-engine` from a NON-default ref must be refused by that
# environment's default-branch-only deployment branch policy. Reads no secret.
on:
  push:
    branches: ["probe/**"]
permissions: {}
jobs:
  from-a-branch:
    runs-on: ubuntu-latest
    environment: shipmate-engine
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          set -u
          echo "ref=$REF"
          echo "environment=shipmate-engine reached from a non-default ref"
