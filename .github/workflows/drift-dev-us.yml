name: shipmate drift dev-us
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  drift:
    name: sweep
    uses: ship-iac/shipmate/.github/workflows/drift.yml@main
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
    with:
      runs_on: ubuntu-26.04-arm
      tags: env/dev-us
