name: probe-m26-task0
on:
  workflow_dispatch:
    inputs:
      arm: { required: true, type: choice, options: [checks, cancel] }
      sha: { required: false, default: "" }
permissions: { contents: read }
jobs:
  checks:
    if: inputs.arm == 'checks'
    runs-on: ubuntu-latest
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 4326562
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -u
          r=repos/$GITHUB_REPOSITORY/check-runs
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          q='{status,conclusion,title:.output.title,summary:.output.summary,text:.output.text,external_id,details_url}'
          show() { for n in 1 2 3 4 5 6; do if out=$(gh api "$r/$1" --jq "$q" 2>&1); then echo "GET (attempt $n): $out"; return; fi; echo "GET attempt $n: $out"; sleep 2; done; }
          patch() { echo "PATCH response: $(gh api -X PATCH "$r/$id" "$@" --jq "$q" 2>&1)"; }
          id=$(gh api -X POST $r -f name='probe-m26 / task0' -f head_sha="$SHA" -f status=queued -f external_id=ext-1 \
            -f details_url=https://example.com/created -f 'output[title]=T0' -f 'output[summary]=S0' -f 'output[text]=X0' --jq .id)
          echo "== T1 created $id"; show $id
          echo "== T1b App token GET of the earlier probe check"; show 131483244739
          patch -f status=in_progress; echo "== T2 status-only in_progress"; show $id
          patch -f details_url="$run_url"; echo "== T3 details_url only"; show $id
          patch -f status=queued -f 'output[title]=Failed: boom' -f 'output[summary]=S0 kept'; echo "== T4 in_progress to queued with output"; show $id
          patch -f status=in_progress; echo "== T4b queued to in_progress again"; show $id
          patch -f status=completed -f conclusion=success; echo "== T5 completed"; show $id
          patch -f status=in_progress; echo "== T6 status-only in_progress on completed"; show $id
          patch -f status=queued; echo "== T6b status-only queued on completed"; show $id
          patch -f status=in_progress -f 'output[title]=late' -f 'output[summary]=late'; echo "== T7 in_progress plus output on completed"; show $id
          echo "== T8 rate: 256 PATCHes with output, 8 parallel, on a second check"
          id2=$(gh api -X POST $r -f name='probe-m26 / rate' -f head_sha="$SHA" -f status=queued -f 'output[title]=R' -f 'output[summary]=R' --jq .id)
          gh api -i rate_limit | grep -i '^x-ratelimit' || true
          start=$(date +%s)
          seq 1 256 | xargs -P 8 -I{} sh -c "gh api -i -X PATCH $r/$id2 -f status=in_progress -f 'output[title]=n{}' -f 'output[summary]=s{}' 2>&1 | head -1" | sort | uniq -c
          echo "elapsed $(( $(date +%s) - start )) s"
          gh api -i rate_limit | grep -i '^x-ratelimit' || true
          gh api -X PATCH $r/$id2 -f status=completed -f conclusion=neutral --jq .status
  snapshot:
    if: inputs.arm == 'cancel'
    runs-on: ubuntu-latest
    steps:
      - run: echo snapshot
  wave0:
    needs: [snapshot]
    if: ${{ !failure() && !cancelled() && inputs.arm == 'cancel' }}
    runs-on: ubuntu-latest
    steps:
      - run: sleep 600
  wave1:
    needs: [wave0]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo wave1
  wave0-complete:
    needs: [snapshot, wave0]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave0.result == 'success' || needs.wave0.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo wave0-complete
  wave1-complete:
    needs: [snapshot, wave1]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave1.result == 'success' || needs.wave1.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo wave1-complete
  complete:
    needs: [snapshot, wave0, wave1, wave0-complete, wave1-complete]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "complete wave0=${{ needs.wave0.result }} wave1=${{ needs.wave1.result }}"
