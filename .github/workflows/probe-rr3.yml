name: probe-rr3
on:
  pull_request_target:
    types: [opened, synchronize]
permissions: { contents: read, actions: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - run: echo "attempt=$GITHUB_RUN_ATTEMPT" > plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: plan, path: plan.txt, overwrite: true }
  router:
    if: github.run_attempt > 1
    runs-on: ubuntu-latest
    steps:
      - run: echo router
  reader:
    needs: router
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", RUN: "${{ github.run_id }}" }
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n plan -D d && echo "READ $(cat d/plan.txt) in attempt $GITHUB_RUN_ATTEMPT"
  gated:
    needs: router
    runs-on: ubuntu-latest
    environment: probe-wait
    steps:
      - run: echo gated
