name: tmp review test

# Throwaway: lets the shipmate App author PR reviews so reviewDecision
# semantics can be tested in a single-maintainer org. Delete after use.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
      event:
        description: REQUEST_CHANGES or APPROVE
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
          EVENT: ${{ inputs.event }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event="$EVENT" -f body="tmp reviewDecision semantics test"
