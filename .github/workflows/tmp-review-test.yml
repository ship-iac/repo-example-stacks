name: tmp-review-test
# Throwaway acceptance probe: posts a review as github-actions[bot] so
# reviewDecision semantics can be tested with a single human account.
# Same pattern as test-approve, plus REQUEST_CHANGES/DISMISS. Delete after use.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
      event:
        description: APPROVE or REQUEST_CHANGES
        required: true
permissions:
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-slim
    steps:
      - name: Post review as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.inputs.pr }}
          EVENT: ${{ github.event.inputs.event }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event="$EVENT" -f body="tmp reviewDecision semantics probe ($EVENT)"
