name: probe-m26-t2-callee
on:
  workflow_call:
permissions: {}
jobs:
  write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - run: echo x > probe-cache.txt
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env: { ACTIONS_CACHE_MODE: write }
        with: { path: probe-cache.txt, key: "probe-m26-nested-${{ github.event_name }}-${{ github.run_id }}" }
