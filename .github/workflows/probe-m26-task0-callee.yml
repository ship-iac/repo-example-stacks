name: probe-m26-task0-callee
on:
  workflow_call:
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-slim
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - run: echo snapshot
  wave0:
    needs: [snapshot]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: sleep 600
  wave1:
    needs: [wave0]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo wave1
  wave0-complete:
    needs: [snapshot, wave0]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave0.result == 'success' || needs.wave0.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - run: echo wave0-complete
  wave1-complete:
    needs: [snapshot, wave1]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave1.result == 'success' || needs.wave1.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - run: echo wave1-complete
  complete:
    needs: [snapshot, wave0, wave1, wave0-complete, wave1-complete]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-slim
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - run: echo "complete wave0=${{ needs.wave0.result }} wave1=${{ needs.wave1.result }}"
