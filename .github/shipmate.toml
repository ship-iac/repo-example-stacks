# Dynamic backend: the layout derives `TF_VAR_env` from each environment's own name
# and `TF_VAR_region` from its `region`. Under `dry` every environment in the matrix
# needs an entry with a non-empty region, or the run refuses at detect.
layout = "dry"

# Who may drive shipmate by pull-request comment, and which environments a targeted
# apply may reach without an approving review. Every repository declares its own team:
# the engine reads this file and no repository variable.
[gate]
approvers_team = "deployers"
ungated_envs = ["dev-eu"]

[env_order]
dev-us = ["dev-eu"]

[environments.dev-eu]
region = "eu-west-1"

[environments.dev-us]
region = "us-east-1"

[environments.sbx]
region = "eu-west-1"
