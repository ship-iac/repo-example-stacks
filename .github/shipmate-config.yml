# Dynamic backend: the layout derives `TF_VAR_env` from each environment's own name
# and `TF_VAR_region` from its `region`. Under `tf_vars` every environment in the matrix
# needs an entry with a non-empty region, or the run refuses at detect.
layout: tf_vars

environments:
  # A targeted apply to dev-eu needs no approving review.
  dev-eu:
    region: eu-west-1
    review: false

  dev-us:
    region: us-east-1
    apply_mode: targeted

  # dev-eu fully applies first. A green autoplan applies sbx with no comment.
  sbx:
    region: eu-west-1
    needs: [dev-eu]
    apply_mode: auto
    review: false
